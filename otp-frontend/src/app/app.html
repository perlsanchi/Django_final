<div class="card">
  <h2>OTP Login</h2>

  <!-- STEP 1: Mobile -->
  <div *ngIf="step === 'mobile'">
    <label>Mobile Number</label>
    <input
      type="tel"
      [(ngModel)]="mobile"
      placeholder="+919876543210"
      [disabled]="loading"
    />
    <button (click)="sendOtp()" [disabled]="loading">
      {{ loading ? 'Sending…' : 'Send OTP Call' }}
    </button>
  </div>

  <!-- STEP 2: OTP -->
  <div *ngIf="step === 'otp'">
    <p class="hint">📞 An OTP call was initiated to <b>{{ mobile }}</b></p>
    <label>Enter OTP</label>
    <input
      type="text"
      [(ngModel)]="otp"
      maxlength="6"
      inputmode="numeric"
      placeholder="6-digit OTP"
      [disabled]="loading"
    />
    <button (click)="verifyOtp()" [disabled]="loading">
      {{ loading ? 'Verifying…' : 'Verify OTP' }}
    </button>
    <button class="link" (click)="reset()">Change number</button>
  </div>

  <!-- STEP 3: Done -->
  <div *ngIf="step === 'done'">
    <p class="success">✅ {{ message }}</p>
    <button (click)="reset()">Start over</button>
  </div>

  <p *ngIf="message && step !== 'done'" class="info">{{ message }}</p>
  <p *ngIf="error" class="error">{{ error }}</p>
</div>
